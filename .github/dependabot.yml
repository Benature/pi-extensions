version: 2
# Version updates are disabled on purpose: Dependabot only opens pull
# requests, and this repository reports updates as an issue instead. The
# weekly dependency-check workflow opens or refreshes the
# "Dependency updates available" issue; security updates stay off in the
# repository settings.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directories:
      - /
      - /pi-ask
      - /pi-automode
      - /pi-slate
      - /pi-subagents
      - /pi-web-search
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      development:
        dependency-type: development
